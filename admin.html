<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfitLens — Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #0d0f14; --bg2: #13161e; --bg3: #1a1e28; --bg4: #1f2435;
      --bdr:  #2a2f3d; --bdr2: #3a4055;
      --txt:  #e8eaf0; --txt2: #8890a6; --txt3: #555e78;
      --acc:  #5b6af5; --acc2: #4a58e8;
      --grn:  #22c55e; --red: #ef4444; --ylw: #f59e0b; --pur: #8b5cf6;
      --mono: 'JetBrains Mono','Fira Code',monospace;
      --body: 'Inter',system-ui,sans-serif;
    }

    body { background: var(--bg); color: var(--txt); font-family: var(--body); min-height: 100vh; }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,15,20,.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bdr);
      height: 54px; display: flex; align-items: center; padding: 0 24px; gap: 12px;
    }
    .nav-logo { font-weight: 700; font-size: 15px; }
    .nav-logo span { color: var(--acc); }
    .badge {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      background: rgba(239,68,68,.15); color: var(--red);
      border: 1px solid rgba(239,68,68,.2); border-radius: 20px; letter-spacing: .05em;
    }
    .nav-spacer { flex: 1; }
    .nav-email { font-size: 12px; color: var(--txt2); font-family: var(--mono); }

    /* ── Admin profile menu ── */
    .nav-menu-wrap { position: relative; }
    .nav-menu-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--bdr2);
      background: linear-gradient(135deg,var(--acc),var(--pur));
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff; transition: border-color .15s;
    }
    .nav-menu-btn:hover { border-color: var(--acc); }
    .nav-menu-drop {
      display: none; position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--bg3); border: 1px solid var(--bdr2); border-radius: 12px;
      padding: 6px; min-width: 200px; box-shadow: 0 12px 32px rgba(0,0,0,.5);
      z-index: 200;
    }
    .nav-menu-drop.open { display: block; }
    .nav-menu-email {
      padding: 8px 12px 10px; font-size: 11px; color: var(--txt3);
      font-family: var(--mono); border-bottom: 1px solid var(--bdr); margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--txt2);
      text-decoration: none; transition: background .12s, color .12s;
    }
    .nav-menu-item:hover { background: var(--bg4); color: var(--txt); }
    .nav-menu-item svg { flex-shrink: 0; }
    .nav-menu-sep { height: 1px; background: var(--bdr); margin: 4px 0; }
    .nav-menu-item.danger { color: var(--red); }
    .nav-menu-item.danger:hover { background: rgba(239,68,68,.1); color: var(--red); }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--txt2); font-size: 13px; margin-bottom: 28px; }

    /* ─── Stat cards ─── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 28px; }
    .stat {
      background: var(--bg2); border: 1px solid var(--bdr); border-radius: 10px; padding: 16px 18px;
    }
    .stat-label { font-size: 11px; color: var(--txt2); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .stat-val { font-size: 28px; font-weight: 700; font-family: var(--mono); }
    .stat-val.blue  { color: var(--acc); }
    .stat-val.green { color: var(--grn); }
    .stat-val.gold  { color: var(--ylw); }

    /* ─── Table ─── */
    .table-card {
      background: var(--bg2); border: 1px solid var(--bdr); border-radius: 12px; overflow: hidden;
    }
    .table-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid var(--bdr);
    }
    .table-title { font-size: 14px; font-weight: 600; flex: 1; }
    .search-input {
      background: var(--bg3); border: 1px solid var(--bdr); border-radius: 8px;
      padding: 7px 12px; color: var(--txt); font-size: 13px; font-family: var(--body);
      outline: none; transition: border-color .15s; width: 220px;
    }
    .search-input:focus { border-color: var(--acc); }
    .search-input::placeholder { color: var(--txt3); }

    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 16px; text-align: left; background: var(--bg3); color: var(--txt2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    td { padding: 12px 16px; border-top: 1px solid var(--bdr); font-size: 13px; vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,.015); }

    .role-badge {
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px;
    }
    .role-admin { background: rgba(139,92,246,.15); color: var(--pur); border: 1px solid rgba(139,92,246,.25); }
    .role-user  { background: rgba(91,106,245,.1);  color: var(--acc); border: 1px solid rgba(91,106,245,.2); }

    .data-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px;
    }

    .actions { display: flex; gap: 6px; }
    .btn {
      padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
      cursor: pointer; font-family: var(--body); border: none; transition: all .15s;
    }
    .btn-ghost  { background: transparent; color: var(--txt2); border: 1px solid var(--bdr2); }
    .btn-ghost:hover  { border-color: var(--acc); color: var(--txt); }
    .btn-danger { background: rgba(239,68,68,.1); color: var(--red); border: 1px solid rgba(239,68,68,.2); }
    .btn-danger:hover { background: rgba(239,68,68,.2); }
    .btn-promote { background: rgba(139,92,246,.1); color: var(--pur); border: 1px solid rgba(139,92,246,.2); }
    .btn-promote:hover { background: rgba(139,92,246,.2); }

    .empty { padding: 40px; text-align: center; color: var(--txt3); font-size: 14px; }

    /* ─── Mobile responsive ─── */
    @media (max-width: 720px) {
      nav { padding: 0 14px; gap: 8px; }
      .nav-logo { font-size: 13px; }
      main { padding: 20px 12px; }
      h1 { font-size: 19px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .stat { padding: 12px 14px; }
      .stat-val { font-size: 22px; }

      .table-header { flex-wrap: wrap; padding: 14px; }
      .table-title { flex: 1 1 100%; order: -1; }
      .search-input { flex: 1 1 auto; width: auto; min-width: 0; }

      .promo-form { padding: 14px; }
      .promo-form input { flex: 1 1 140px; width: auto; }
      .promo-form input[type=number] { flex: 1 1 90px; }
      .btn-create { flex: 1 1 100%; padding: 8px; }

      /* Turn table rows into stacked cards */
      table, thead, tbody, th, td, tr { display: block; width: 100%; }
      thead { display: none; }
      tbody tr {
        border: 1px solid var(--bdr); border-radius: 10px;
        margin: 10px; padding: 4px 12px; background: var(--bg3);
      }
      tr:hover td { background: transparent; }
      td {
        display: flex; justify-content: space-between; align-items: center;
        gap: 12px; padding: 9px 0 !important; border: none !important;
        border-bottom: 1px solid var(--bdr) !important; text-align: right;
        font-size: 13px;
      }
      td:last-child { border-bottom: none !important; }
      td::before {
        content: attr(data-label); font-size: 10px; text-transform: uppercase;
        letter-spacing: .04em; color: var(--txt3); font-weight: 700;
        white-space: nowrap; flex-shrink: 0;
      }
      td[data-label=""]::before { content: none; }
      .actions { flex-wrap: wrap; justify-content: flex-end; }
    }

    /* ─── Promo codes ─── */
    .promo-form {
      display: flex; gap: 8px; padding: 16px 20px;
      border-bottom: 1px solid var(--bdr); flex-wrap: wrap;
    }
    .promo-form input {
      background: var(--bg3); border: 1px solid var(--bdr2); border-radius: 8px;
      padding: 7px 12px; color: var(--txt); font-size: 13px; font-family: var(--mono);
      outline: none; transition: border-color .15s; width: 180px; text-transform: uppercase;
      letter-spacing: .06em;
    }
    .promo-form input:focus { border-color: var(--acc); }
    .promo-form input::placeholder { text-transform: none; letter-spacing: 0; color: var(--txt3); }
    .promo-form input[type=number] { width: 90px; font-family: var(--body); letter-spacing: 0; }
    .btn-create { background: rgba(91,106,245,.15); color: var(--acc); border: 1px solid rgba(91,106,245,.25); }
    .btn-create:hover { background: rgba(91,106,245,.25); }
    .promo-used { font-size: 11px; color: var(--txt3); font-family: var(--mono); }
    .badge-active   { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: rgba(34,197,94,.12); color: var(--grn); border: 1px solid rgba(34,197,94,.2); }
    .badge-inactive { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: rgba(239,68,68,.1); color: var(--red); border: 1px solid rgba(239,68,68,.2); }

    /* ─── Loading spinner ─── */
    .spinner {
      width: 32px; height: 32px; margin: 40px auto;
      border: 3px solid var(--bdr); border-top-color: var(--acc); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Toast ─── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: var(--bg3); border: 1px solid var(--bdr); border-radius: 10px;
      padding: 12px 18px; font-size: 13px; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,.4); max-width: 320px;
    }
    #toast.show { display: block; animation: slideIn .2s ease; }
    #toast.success { border-color: rgba(34,197,94,.3); color: var(--grn); }
    #toast.error   { border-color: rgba(239,68,68,.3);  color: var(--red); }
    @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    #gate { display: flex; align-items: center; justify-content: center; min-height: 80vh; flex-direction: column; gap: 16px; }
    #gate h2 { font-size: 20px; color: var(--txt2); }
    #gate p  { font-size: 13px; color: var(--txt3); }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">Profit<span>Lens</span> Pro</div>
  <span class="badge">ADMIN</span>
  <div class="nav-spacer"></div>
  <div class="nav-menu-wrap">
    <button class="nav-menu-btn" id="navMenuBtn" onclick="toggleAdminMenu()">A</button>
    <div class="nav-menu-drop" id="navMenuDrop">
      <div class="nav-menu-email" id="nav-email">—</div>
      <a class="nav-menu-item" href="/app">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        الأداة الأساسية
      </a>
      <a class="nav-menu-item" href="/admin-feedback">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        الرسائل
      </a>
      <a class="nav-menu-item" href="/admin-tutorials">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        قوائم الشرح
      </a>
      <div class="nav-menu-sep"></div>
      <div class="nav-menu-item danger" onclick="doLogout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </div>
    </div>
  </div>
</nav>

<div id="gate" style="display:none">
  <h2>Access Denied</h2>
  <p>You need admin privileges to view this page.</p>
  <button class="btn btn-ghost" style="padding:8px 20px;font-size:13px" onclick="window.location.replace('/')">Go to login</button>
</div>

<main id="admin-main" style="display:none">
  <h1>Admin Dashboard</h1>
  <p class="subtitle">Manage users and monitor platform activity.</p>

  <div class="stats" id="stats-grid">
    <div class="stat"><div class="stat-label">Total Users</div><div class="stat-val blue" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">With Data</div><div class="stat-val green" id="stat-data">—</div></div>
    <div class="stat"><div class="stat-label">Admins</div><div class="stat-val gold" id="stat-admins">—</div></div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <div class="table-title">Users</div>
      <input class="search-input" id="search" placeholder="Search by email…" oninput="filterUsers()">
      <button class="btn btn-ghost" style="padding:6px 14px;font-size:12px" onclick="loadUsers()">↻ Refresh</button>
    </div>
    <div id="table-wrap">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Promo Codes -->
  <div class="table-card" style="margin-top:24px">
    <div class="table-header">
      <div class="table-title">🎟️ Promo Codes</div>
      <button class="btn btn-ghost" style="padding:6px 14px;font-size:12px" onclick="loadPromos()">↻ Refresh</button>
    </div>
    <div class="promo-form">
      <input id="new-code" placeholder="PROMO CODE" maxlength="32" autocomplete="off" spellcheck="false"
        oninput="this.value=this.value.toUpperCase()">
      <input id="new-uses" type="number" placeholder="Max uses" min="1" value="1">
      <input id="new-discount" type="number" placeholder="Discount %" min="0" max="100" value="100" title="Discount percentage this code grants">
      <button class="btn btn-create" onclick="createPromo()">+ Create Code</button>
    </div>
    <div id="promos-wrap"><div class="spinner"></div></div>
  </div>
</main>

<div id="toast"></div>

<script>
let __sb = null;
let __session = null;
let __token = null;
let allUsers = [];

async function init() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
    if (!cfg.supabaseUrl) { showGate(); return; }
    const { createClient } = supabase;
    __sb = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    const { data: { session } } = await __sb.auth.getSession();
    if (!session) { window.location.replace('/'); return; }
    __session = session;
    __token = session.access_token;
    document.getElementById('nav-email').textContent = session.user.email;
    const btn = document.getElementById('navMenuBtn');
    if (btn) btn.textContent = (session.user.email||'A').charAt(0).toUpperCase();

    // Check admin role
    const { data: profile } = await __sb.from('profiles').select('role').eq('id', session.user.id).single();
    if (profile?.role !== 'admin') { showGate(); return; }

    document.getElementById('admin-main').style.display = '';

    // Event delegation — replaces inline onclick built from user-controlled strings.
    // Values are read from data-* attributes (HTML-escaped), never interpolated into JS.
    document.getElementById('table-wrap').addEventListener('click', e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, id, role, plan, email } = btn.dataset;
      if (action === 'toggle') toggleRole(id, role, email);
      else if (action === 'toggle-plan') togglePlan(id, plan, email);
      else if (action === 'delete-user') deleteUser(id, email);
    });
    document.getElementById('promos-wrap').addEventListener('click', e => {
      const btn = e.target.closest('button[data-action="delete-promo"]');
      if (!btn) return;
      deletePromo(btn.dataset.id, btn.dataset.code);
    });

    loadUsers();
    loadPromos();
  } catch(e) { showGate(); }
}

function showGate() { document.getElementById('gate').style.display = ''; }

async function doLogout() {
  if (__sb) await __sb.auth.signOut();
  window.location.replace('/');
}

function toggleAdminMenu() {
  document.getElementById('navMenuDrop').classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.nav-menu-wrap'))
    document.getElementById('navMenuDrop')?.classList.remove('open');
});

async function loadUsers() {
  document.getElementById('table-wrap').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch('/api/admin/users', {
      headers: { 'Authorization': 'Bearer ' + __token }
    });
    if (!res.ok) throw new Error(await res.text());
    const { users } = await res.json();
    allUsers = users;
    updateStats(users);
    renderTable(users);
  } catch(e) {
    document.getElementById('table-wrap').innerHTML = `<div class="empty">Failed to load users: ${esc(e.message)}</div>`;
  }
}

function updateStats(users) {
  document.getElementById('stat-total').textContent  = users.length;
  document.getElementById('stat-data').textContent   = users.filter(u => u.has_data).length;
  document.getElementById('stat-admins').textContent = users.filter(u => u.role === 'admin').length;
}

function filterUsers() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = q ? allUsers.filter(u => u.email.toLowerCase().includes(q)) : allUsers;
  renderTable(filtered);
}

function renderTable(users) {
  if (!users.length) {
    document.getElementById('table-wrap').innerHTML = '<div class="empty">No users found.</div>';
    return;
  }

  const rows = users.map(u => {
    const isMe = u.id === __session.user.id;
    const created = new Date(u.created_at).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
    const lastSeen = u.last_sign_in_at
      ? new Date(u.last_sign_in_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
      : 'Never';

    return `<tr>
      <td data-label="Email">
        <div style="font-weight:500">${esc(u.email)}${isMe ? ' <span style="font-size:10px;color:var(--txt3)">(you)</span>' : ''}</div>
        <div style="font-size:11px;color:var(--txt3);font-family:var(--mono);margin-top:2px">${u.id.slice(0,8)}…</div>
      </td>
      <td data-label="Role"><span class="role-badge ${u.role === 'admin' ? 'role-admin' : 'role-user'}">${u.role}</span></td>
      <td data-label="Plan"><span class="role-badge ${u.plan === 'free' ? 'role-user' : 'role-admin'}">${esc(u.plan)}</span></td>
      <td data-label="Has Data">
        <span class="data-dot" style="background:${u.has_data ? 'var(--grn)' : 'var(--txt3)'}"></span>
        ${u.has_data ? 'Yes' : 'No'}
      </td>
      <td data-label="Promo">
        ${u.promo_code
          ? `<span style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--acc)">${esc(u.promo_code)}</span>`
            + (u.promo_discount == null ? '' : ` <span class="role-badge role-user" style="margin-left:4px">${esc(String(u.promo_discount))}%</span>`)
          : '<span style="color:var(--txt3)">—</span>'}
      </td>
      <td data-label="Joined" style="color:var(--txt2);font-size:12px">${created}</td>
      <td data-label="Last Sign In" style="color:var(--txt2);font-size:12px">${lastSeen}</td>
      <td data-label="">
        <div class="actions">
          <button class="btn ${u.plan==='free'?'btn-create':'btn-ghost'}"
            data-action="toggle-plan" data-id="${esc(u.id)}" data-plan="${esc(u.plan)}" data-email="${esc(u.email)}">
            ${u.plan==='free' ? 'Activate Pro' : 'Set Free'}
          </button>
          ${!isMe ? `
            <button class="btn ${u.role==='admin'?'btn-ghost':'btn-promote'}"
              data-action="toggle" data-id="${esc(u.id)}" data-role="${esc(u.role)}" data-email="${esc(u.email)}">
              ${u.role === 'admin' ? 'Demote' : 'Make Admin'}
            </button>
            <button class="btn btn-danger" data-action="delete-user" data-id="${esc(u.id)}" data-email="${esc(u.email)}">Delete</button>
          ` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('table-wrap').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Email</th><th>Role</th><th>Plan</th><th>Has Data</th><th>Promo</th>
          <th>Joined</th><th>Last Sign In</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function toggleRole(userId, currentRole, email) {
  const newRole = currentRole === 'admin' ? 'user' : 'admin';
  if (!confirm(`Change ${email} to ${newRole}?`)) return;
  try {
    const res = await fetch('/api/admin/users', {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + __token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, role: newRole })
    });
    if (!res.ok) throw new Error(await res.text());
    toast(`Role updated to ${newRole}`, 'success');
    loadUsers();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function togglePlan(userId, currentPlan, email) {
  const newPlan = currentPlan === 'free' ? 'pro' : 'free';
  const action  = newPlan === 'pro' ? 'activate Pro for' : 'downgrade to Free';
  if (!confirm(`${newPlan === 'pro' ? 'Activate Pro for' : 'Downgrade to Free'} ${email}?`)) return;
  try {
    const res = await fetch('/api/admin/users', {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + __token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, plan: newPlan })
    });
    if (!res.ok) throw new Error(await res.text());
    toast(`Plan updated to ${newPlan}`, 'success');
    loadUsers();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function deleteUser(userId, email) {
  if (!confirm(`Delete ${email}? This cannot be undone.`)) return;
  try {
    const res = await fetch('/api/admin/users', {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + __token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });
    if (!res.ok) throw new Error(await res.text());
    toast('User deleted.', 'success');
    loadUsers();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type||'');
  clearTimeout(el.__t);
  el.__t = setTimeout(() => { el.className = ''; }, 3000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── PROMO CODES ───────────────────────────────────────────
async function loadPromos() {
  document.getElementById('promos-wrap').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch('/api/admin/promos', { headers: { 'Authorization': 'Bearer ' + __token } });
    if (!res.ok) throw new Error(await res.text());
    const { promos } = await res.json();
    renderPromos(promos);
  } catch(e) {
    document.getElementById('promos-wrap').innerHTML = `<div class="empty">Failed: ${esc(e.message)}</div>`;
  }
}

function renderPromos(promos) {
  if (!promos.length) {
    document.getElementById('promos-wrap').innerHTML = '<div class="empty">No promo codes yet. Create one above.</div>';
    return;
  }
  const rows = promos.map(p => {
    const created = new Date(p.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const full = p.uses_count >= p.max_uses;
    return `<tr>
      <td data-label="Code"><span style="font-family:var(--mono);font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.06em">${esc(p.code)}</span></td>
      <td data-label="Discount"><span class="badge-active" style="font-family:var(--mono)">${esc(String(p.discount_pct == null ? 100 : p.discount_pct))}%</span></td>
      <td data-label="Uses" class="promo-used">${p.uses_count} / ${p.max_uses}</td>
      <td data-label="Progress">
        <div style="background:var(--bg3);border-radius:6px;overflow:hidden;height:6px;width:80px">
          <div style="background:${full?'var(--red)':'var(--grn)'};height:100%;width:${Math.min(100,Math.round(p.uses_count/p.max_uses*100))}%"></div>
        </div>
      </td>
      <td data-label="Status"><span class="${p.is_active && !full ? 'badge-active' : 'badge-inactive'}">${p.is_active && !full ? 'Active' : 'Exhausted'}</span></td>
      <td data-label="Created" style="color:var(--txt2);font-size:12px">${created}</td>
      <td data-label="">
        <button class="btn btn-danger" data-action="delete-promo" data-id="${esc(p.id)}" data-code="${esc(p.code)}">Delete</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('promos-wrap').innerHTML = `
    <table>
      <thead><tr>
        <th>Code</th><th>Discount</th><th>Uses</th><th>Progress</th><th>Status</th><th>Created</th><th>Actions</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function createPromo() {
  const code = document.getElementById('new-code').value.trim();
  const maxUses = parseInt(document.getElementById('new-uses').value) || 1;
  const discount = parseInt(document.getElementById('new-discount').value);
  if (!code) { toast('Enter a code first', 'error'); return; }
  if (!Number.isFinite(discount) || discount < 0 || discount > 100) {
    toast('Discount must be between 0 and 100', 'error'); return;
  }
  try {
    const res = await fetch('/api/admin/promos', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + __token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, max_uses: maxUses, discount_pct: discount })
    });
    if (!res.ok) { const j = await res.json(); throw new Error(j.error); }
    document.getElementById('new-code').value = '';
    document.getElementById('new-uses').value = '1';
    document.getElementById('new-discount').value = '100';
    toast('Promo code created!', 'success');
    loadPromos();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function deletePromo(id, code) {
  if (!confirm(`Delete promo code "${code}"?`)) return;
  try {
    const res = await fetch('/api/admin/promos', {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + __token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    if (!res.ok) throw new Error(await res.text());
    toast('Promo code deleted.', 'success');
    loadPromos();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

init();
</script>
